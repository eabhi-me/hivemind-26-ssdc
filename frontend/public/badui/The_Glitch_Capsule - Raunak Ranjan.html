<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Glitch Capsule </title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Space+Grotesk:wght@400;700&display=swap');

    @keyframes smoothFlow1 {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 0%; }
    }

    @keyframes smoothFlow2 {
      0% { background-position: 100% 100%; }
      50% { background-position: 0% 50%; }
      100% { background-position: 100% 100%; }
    }

    @keyframes smoothFlow3 {
      0% { background-position: 50% 100%; }
      50% { background-position: 50% 0%; }
      100% { background-position: 50% 100%; }
    }

    @keyframes hyperStrobeSmooth {
      0% { filter: hue-rotate(0deg) saturate(300%) contrast(180%) drop-shadow(0 0 20px rgba(255,0,128,0.6)); }
      33% { filter: hue-rotate(120deg) saturate(500%) contrast(220%) invert(8%) drop-shadow(0 0 30px rgba(0,242,254,0.6)); }
      66% { filter: hue-rotate(240deg) saturate(400%) contrast(200%) invert(15%) drop-shadow(0 0 25px rgba(120,0,255,0.6)); }
      100% { filter: hue-rotate(360deg) saturate(300%) contrast(180%) drop-shadow(0 0 20px rgba(255,0,128,0.6)); }
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Space Grotesk', sans-serif;
      
      background: linear-gradient(135deg, #050505, #111118, #1a1025),
                  radial-gradient(circle at 15% 25%, rgba(255, 0, 128, 0.8) 0%, transparent 50%),
                  radial-gradient(circle at 85% 75%, rgba(0, 242, 254, 0.8) 0%, transparent 50%),
                  radial-gradient(circle at 50% 50%, rgba(120, 0, 255, 0.7) 0%, transparent 60%);
      background-size: 400% 400%;
      
      animation: smoothFlow1 12s ease-in-out infinite, hyperStrobeSmooth 3s ease-in-out infinite;
      
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    .screen-glitch-line {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 999;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
    }

    @keyframes textGlitchFlash {
      0% { transform: skew(0deg); filter: none; }
      20% { transform: skew(-5deg) scaleX(1.02); filter: drop-shadow(2px 0 #ff0080) drop-shadow(-2px 0 #00f2fe); }
      22% { transform: skew(10deg) scaleX(0.98); filter: drop-shadow(-3px 0 #ff0080) drop-shadow(3px 0 #00f2fe); }
      24% { transform: skew(0deg); filter: none; }
      75% { transform: skew(0deg); filter: none; }
      77% { transform: skew(-8deg); filter: drop-shadow(4px 0 #ff0080); }
      79% { transform: skew(0deg); filter: none; }
      100% { transform: skew(0deg); filter: none; }
    }

    .disturbance-particle {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      z-index: 1;
      opacity: 0.5;
      pointer-events: none;
      animation: floatParticle 6s ease-in-out infinite alternate;
    }

    @keyframes floatParticle {
      0% { transform: translate(-100px, -100px) scale(0.8); }
      100% { transform: translate(100vw, 100vh) scale(1.4); }
    }

    @keyframes waveCapsule {
      0% {
        border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
        transform: rotate(-1.5deg) scale(1) translateY(0px);
      }
      25% {
        border-radius: 55% 45% 50% 50% / 40% 60% 40% 60%;
        transform: rotate(1deg) scale(1.01) translateY(-6px);
      }
      50% {
        border-radius: 65% 35% 45% 55% / 55% 45% 55% 45%;
        transform: rotate(1.5deg) scale(1.02) translateY(0px);
      }
      75% {
        border-radius: 50% 50% 60% 40% / 60% 40% 50% 50%;
        transform: rotate(-1deg) scale(1.01) translateY(6px);
      }
      100% {
        border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
        transform: rotate(-1.5deg) scale(1) translateY(0px);
      }
    }

    @keyframes waveInnerCircle {
      0% {
        border-radius: 50% 50% 40% 60% / 60% 40% 50% 50%;
        transform: rotate(0deg) scale(1);
      }
      33% {
        border-radius: 40% 60% 60% 40% / 50% 60% 40% 50%;
        transform: rotate(120deg) scale(1.04);
      }
      66% {
        border-radius: 60% 40% 50% 50% / 40% 50% 60% 40%;
        transform: rotate(240deg) scale(0.96);
      }
      100% {
        border-radius: 50% 50% 40% 60% / 60% 40% 50% 50%;
        transform: rotate(360deg) scale(1);
      }
    }

    @keyframes dynamicPulseText {
      0% { font-size: 2.2rem; letter-spacing: 3px; }
      50% { font-size: 2.6rem; letter-spacing: 6px; }
      100% { font-size: 2.2rem; letter-spacing: 3px; }
    }

    .blob-card {
      width: 100%;
      max-width: 520px;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      padding: 45px 40px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.95), inset 0 0 30px rgba(255,0,128,0.25);
      z-index: 10;
      color: #00f2fe;
      animation: waveCapsule 6s ease-in-out infinite, textGlitchFlash 5s infinite; 
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 40px 0;
    }

    h2 {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      color: #fff;
      animation: dynamicPulseText 4s ease-in-out infinite;
      background: linear-gradient(135deg, #ff0080, #00f2fe, #7800ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 15px rgba(255,0,128,0.6));
    }

    label { 
      display: block; 
      margin-top: 15px; 
      font-size: 13px; 
      font-weight: 700;
      color: #ff0080; 
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(255,0,128,0.4);
    }
    
    input[type="text"], input[type="password"] { 
      width: 85%; 
      padding: 12px 20px; 
      background: rgba(255, 255, 255, 0.05); 
      border: 2px solid #00f2fe; 
      border-radius: 50px; 
      color: #fff; 
      font-family: inherit; 
      font-size: 15px;
      margin-top: 6px; 
      outline: none;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,242,254,0.2);
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #ff0080;
      box-shadow: 0 0 20px rgba(255,0,128,0.6);
      transform: scale(1.02);
    }

    select {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(255,0,128,0.15) 0%, rgba(120,0,255,0.3) 100%);
      border: 3px solid transparent;
      border-image: linear-gradient(135deg, #ff0080, #00f2fe, #7800ff) 1;
      color: #00f2fe;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 15px;
      text-align: center;
      text-shadow: 0 0 8px rgba(0,242,254,0.8);
      padding: 10px;
      margin-top: 8px;
      outline: none;
      cursor: pointer;
      appearance: none;
      animation: waveInnerCircle 5s ease-in-out infinite;
      box-shadow: 0 0 25px rgba(255,0,128,0.5), inset 0 0 15px rgba(0,242,254,0.3);
      transition: all 0.4s ease;
    }

    select option {
      background: #0f0f17;
      color: #ff0080;
      font-weight: 700;
      padding: 10px;
    }

    select:hover {
      transform: rotate(180deg) scale(1.08);
      box-shadow: 0 0 35px rgba(0,242,254,0.9), inset 0 0 25px rgba(255,0,128,0.6);
      color: #ff0080;
    }
    
    .slider-container {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0;
    }

    input[type="range"] { 
      width: 130px; 
      cursor: pointer; 
      transform: rotate(270deg); 
      accent-color: #ff0080;
    }
    
    .val-box { 
      background: rgba(0,0,0,0.7); 
      border-radius: 20px;
      padding: 4px 15px;
      color: #00f2fe; 
      font-family: 'Courier New', monospace; 
      font-weight: bold;
      font-size: 13px;
      margin-top: 0px; 
      border: 1px solid #00f2fe;
      box-shadow: 0 0 10px rgba(0,242,254,0.4);
    }

    /* Annoying Feature 1: The Teleporting Checkbox */
    .checkbox-container {
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid #7800ff;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(120,0,255,0.3);
      position: relative;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 220px;
    }

    #teleportBox {
      position: absolute;
      right: 15px;
      cursor: pointer;
      transform: scale(1.3);
    }

    /* Annoying Feature 2: Case-Reverser Text Input */
    #caseReverser {
      text-transform: none;
    }

    /* Annoying Feature 3: Gravity Slider that snaps back */
    #gravitySlider {
      accent-color: #00f2fe;
    }

    /* Annoying Feature 4: Interactive Fake Cookie Banner / Nag Modal */
    #cookieNag {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      background: rgba(120, 0, 255, 0.95);
      border: 2px solid #00f2fe;
      border-radius: 15px;
      padding: 10px;
      font-size: 11px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px rgba(0,242,254,0.5);
      animation: nagFloat 2s ease-in-out infinite alternate;
      z-index: 20;
    }

    @keyframes nagFloat {
      0% { bottom: -15px; }
      100% { bottom: -5px; }
    }

    .nag-btn {
      background: #ff0080;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .color-matrix {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 6px;
    }
    .color-dot {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #fff;
      transition: transform 0.2s;
    }
    .color-dot:hover { transform: scale(1.3); }

    .button-container {
      height: 100px;
      width: 100%;
      margin-top: 15px;
      position: relative;
    }

    #submitBtn {
      position: absolute;
      top: 20px;
      left: 175px;
      width: 85px;
      height: 85px;
      background: linear-gradient(135deg, #ff0080, #7800ff);
      color: white;
      border: 2px solid #00f2fe;
      border-radius: 50%;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      box-shadow: 0 0 25px rgba(255,0,128,0.7);
      cursor: pointer;
      text-transform: uppercase;
      transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1), height 0.3s cubic-bezier(0.25, 1, 0.5, 1), font-size 0.3s ease, top 0.15s ease-out, left 0.15s ease-out;
    }

    #popupOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 5, 10, 0.92);
      backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden; 
      pointer-events: none; 
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #popupOverlay.active {
      opacity: 1;
      visibility: visible; 
      pointer-events: auto; 
    }

    .popup-blob {
      background: linear-gradient(135deg, #ff0080, #00f2fe);
      border-radius: 35% 65% 60% 40% / 40% 60% 40% 60%;
      padding: 50px;
      text-align: center;
      color: #050505;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 50px rgba(0,242,254,0.8);
      animation: waveCapsule 4s ease-in-out infinite alternate;
    }

    .popup-title { font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
  </style>
</head>
<body>

<div class="screen-glitch-line"></div>

<div class="disturbance-particle" style="width: 400px; height: 400px; background: #00f2fe; top: 10%; left: 10%; animation-duration: 8s;"></div>
<div class="disturbance-particle" style="width: 500px; height: 500px; background: #ff0080; bottom: 10%; right: 10%; animation-duration: 10s; animation-direction: reverse;"></div>
<div class="disturbance-particle" style="width: 350px; height: 350px; background: #7800ff; top: 40%; right: 30%; animation-duration: 7s;"></div>

<div id="popupOverlay">
  <div class="popup-blob">
    <div style="font-size: 55px; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));">🚫</div>
    <h3 class="popup-title">Denied</h3>
    <p style="margin-top: 10px; font-size: 16px; font-weight: 700; color: #fff; letter-spacing: 1px;">The morphing grid declines your entry.</p>
  </div>
</div>

<div class="blob-card">
  <h2 id="glitchHeader">Introduce UR Self</h2>
  
  <label for="year">Birth Year / Age Matrix</label>
  <select id="year"></select>

  <label for="phone">Phone Matrix Slider</label>
  <div class="slider-container">
    <input type="range" id="phone" min="1000000000" max="9999999999" value="5000000000" oninput="document.getElementById('pVal').innerText = this.value">
  </div>
  <span id="pVal" class="val-box">5000000000</span>

  <label for="email">Email Inverter Trap</label>
  <input type="text" id="email" placeholder="moc.elpmaxe@u" oninput="this.value = this.value.split('').reverse().join('');">

  <label for="scrambleInput">Vowel Destroyer Field</label>
  <input type="text" id="scrambleInput" placeholder="Type and watch vowels vanish" oninput="destroyVowels(this)">

  <label for="caseReverser">Chaos Case Reverser</label>
  <input type="text" id="caseReverser" placeholder="tYpE hErE wItH cHaOs" oninput="reverseCase(this)">

  <label for="gravitySlider">Snapback Slider (Gravity Trap)</label>
  <div class="slider-container" style="height: 60px;">
    <input type="range" id="gravitySlider" min="0" max="100" value="0" oninput="document.getElementById('gVal').innerText = this.value" onmouseup="resetSlider(this)" ontouchend="resetSlider(this)">
  </div>
  <span id="gVal" class="val-box">0</span>

  <label for="pwd">Cipher Key (Amnesiac)</label>
  <input type="password" id="pwd" placeholder="••••••••" onkeyup="shyPassword(this)">

  <label>Aura Resonance Match</label>
  <div class="color-matrix">
    <div class="color-dot" style="background: #ff0080;" onclick="shiftAura('#ff0080')"></div>
    <div class="color-dot" style="background: #00f2fe;" onclick="shiftAura('#00f2fe')"></div>
    <div class="color-dot" style="background: #7800ff;" onclick="shiftAura('#7800ff')"></div>
    <div class="color-dot" style="background: #39ff14;" onclick="shiftAura('#39ff14')"></div>
  </div>

  <label>Anti-Bot Teleporter</label>
  <div class="checkbox-container">
    <span style="font-size: 12px;">Catch the checkbox</span>
    <input type="checkbox" id="teleportBox" onmouseover="teleportCheckbox(this)" onclick="return triggerPopup(event);"> 
  </div>

  <div class="button-container">
    <button id="submitBtn" onmouseover="fleeAndShrink(this)" onclick="alert('Synced.')">Sync</button>
  </div>

  <div id="cookieNag">
    <span>Accept neural tracking cookies?</span>
    <div>
      <button class="nag-btn" onclick="moveNag(this)">No</button>
      <button class="nag-btn" style="background: #00f2fe; color:#000;" onclick="closeNag()">Yes</button>
    </div>
  </div>
</div>

<script>
  const flows = ['smoothFlow1', 'smoothFlow2', 'smoothFlow3'];
  let currentFlowIndex = 0;
  
  setInterval(() => {
    currentFlowIndex = (currentFlowIndex + 1) % flows.length;
    const bodyStyle = document.body.style;
    bodyStyle.animationName = `${flows[currentFlowIndex]}, hyperStrobeSmooth`;
    const randomDuration = Math.floor(Math.random() * 5) + 8; 
    bodyStyle.animationDuration = `${randomDuration}s, 3s`;
  }, 6000);

  setInterval(() => {
    const header = document.getElementById('glitchHeader');
    const originalText = "Synaptic Void";
    if (Math.random() > 0.75) {
      const glitchChars = "!@#$%^&*<>[]{}~—|\\/";
      let glitched = originalText.split('').map(char => 
        Math.random() > 0.7 ? glitchChars[Math.floor(Math.random() * glitchChars.length)] : char
      ).join('');
      header.innerText = glitched;
      setTimeout(() => { header.innerText = originalText; }, 150);
    }
  }, 2500);

  window.onload = function() {
    const yearSelect = document.getElementById('year');
    let years = [];
    for (let i = 1920; i <= 2026; i++) {
      years.push(i);
    }
    for (let i = years.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [years[i], years[j]] = [years[j], years[i]];
    }
    years.forEach(year => {
      let option = document.createElement('option');
      option.value = year;
      option.text = year;
      yearSelect.appendChild(option);
    });
    
    let defaultOpt = document.createElement('option');
    defaultOpt.text = "Year?";
    defaultOpt.selected = true;
    defaultOpt.disabled = true;
    yearSelect.insertBefore(defaultOpt, yearSelect.firstChild);
  };

  function shyPassword(input) {
    if (Math.random() > 0.65) input.blur();
  }

  function destroyVowels(input) {
    input.value = input.value.replace(/[aeiouAEIOU]/g, '');
  }

  function reverseCase(input) {
    input.value = input.value.split('').map(c => 
      c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()
    ).join('');
  }

  function resetSlider(slider) {
    slider.value = 0;
    document.getElementById('gVal').innerText = "0";
  }

  function shiftAura(color) {
    document.querySelector('.blob-card').style.boxShadow = `0 30px 60px rgba(0, 0, 0, 0.95), inset 0 0 40px ${color}`;
  }

  function teleportCheckbox(box) {
    const currentRight = parseInt(box.style.right) || 15;
    const newRight = currentRight === 15 ? 170 : 15;
    box.style.right = newRight + 'px';
  }

  function moveNag(btn) {
    const currentLeft = parseInt(btn.style.marginLeft) || 0;
    btn.style.marginLeft = (currentLeft === 0 ? 30 : 0) + 'px';
  }

  function closeNag() {
    document.getElementById('cookieNag').style.display = 'none';
  }

  let buttonSize = 85;

  function fleeAndShrink(btn) {
    if(buttonSize > 25) {
      buttonSize -= 8;
      btn.style.width = buttonSize + 'px';
      btn.style.height = buttonSize + 'px';
      btn.style.fontSize = (buttonSize / 4.5) + 'px';
    }

    const containerWidth = btn.parentElement.offsetWidth - buttonSize;
    const containerHeight = btn.parentElement.offsetHeight - buttonSize; 
    
    const topOffset = Math.floor(Math.random() * Math.max(10, containerHeight));
    const leftOffset = Math.floor(Math.random() * Math.max(10, containerWidth));
    
    btn.style.top = topOffset + 'px';
    btn.style.left = leftOffset + 'px';
  }

  function triggerPopup(event) {
    event.preventDefault(); 
    const overlay = document.getElementById('popupOverlay');
    overlay.classList.add('active'); 
    setTimeout(() => { overlay.classList.remove('active'); }, 3000);
    return false; 
  }
</script>

</body>
</html>
